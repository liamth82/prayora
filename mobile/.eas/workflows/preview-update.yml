# Publishes the app to the "preview" branch on every push to main that touches the mobile app.
# Open the result in Expo Go from the project's Updates page on expo.dev.
name: Preview update

on:
  push:
    branches: ['main']
    paths: ['mobile/**']

jobs:
  update:
    name: Publish preview
    type: update
    params:
      branch: preview
      environment: preview
