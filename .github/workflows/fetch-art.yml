# Downloads public-domain manuscript art from Wikimedia Commons into art/ and commits it.
name: Fetch manuscript art
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/fetch_art.py art
      - name: Commit
        run: |
          git config user.name "ora-bot"
          git config user.email "ora-bot@users.noreply.github.com"
          git add art
          git commit -m "Update manuscript art" || echo "no changes"
          git push
