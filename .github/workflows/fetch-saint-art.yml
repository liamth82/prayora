# Finds a public-domain painting on Wikimedia Commons for each saint that has none yet, rebuilds saints/*.json and commits.
name: Fetch saint paintings
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/fetch_saint_art.py saints
      - run: python3 tools/build_saints.py
      - name: Commit
        run: |
          git config user.name "ora-bot"
          git config user.email "ora-bot@users.noreply.github.com"
          git add saints
          git commit -m "Saint paintings" || echo "no changes"
          git pull --rebase && git push
