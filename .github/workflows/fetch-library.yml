# Downloads candidate public-domain texts for the Library into library/raw and commits them.
name: Fetch library texts
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/fetch_library.py library/raw
      - name: Commit
        run: |
          git config user.name "ora-bot"
          git config user.email "ora-bot@users.noreply.github.com"
          git add library
          git commit -m "Fetch library texts" || echo "no changes"
          git pull --rebase && git push
