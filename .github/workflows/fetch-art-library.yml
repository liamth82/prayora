# Builds the sacred art library (art/lib, art/library.json) from Wikidata and Wikimedia Commons and commits it.
name: Fetch art library
on:
  workflow_dispatch:
    inputs:
      max:
        description: Most paintings to keep
        default: "220"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install pillow
      - run: python3 tools/fetch_art_library.py art ${{ inputs.max }}
      - name: Commit
        run: |
          git config user.name "ora-bot"
          git config user.email "ora-bot@users.noreply.github.com"
          git add art
          git commit -m "Update sacred art library" || echo "no changes"
          git pull --rebase
          git push
