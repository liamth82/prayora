# Temporary: checks that the latest preview update and its files can be downloaded.
name: Ora update check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: '${{ secrets.EXPO_TOKEN }}' }
      - run: npm ci
      - name: Inspect update
        env: { EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
        run: |
          set +e
          eas update:list --branch preview --json --non-interactive > list.json 2>err.txt
          GROUP=$(node -e "const j=require('./list.json');const u=(j.currentPage||j)[0];console.log(u.group||u.id||'')")
          URL="https://u.expo.dev/bc5ad831-02d1-4f3a-aedc-e175d8f5cf79/group/$GROUP"
          curl -s -D h.txt -o m.txt -H 'expo-platform: android' -H 'expo-runtime-version: exposdk:57.0.0' -H 'expo-protocol-version: 1' -H 'accept: multipart/mixed,application/expo+json,application/json' "$URL"
          echo "::notice::manifest $(head -1 h.txt) $(grep -i content-type h.txt | tr -d '\r')"
          echo "::notice::body $(head -c 1200 m.txt | tr '\n' ' ')"
          echo "::notice::headers $(tr '\r\n' '  ' < h.txt | head -c 1500)"
          awk '/^\{/{print; exit}' m.txt > mj.txt; [ -s mj.txt ] && cp mj.txt m.txt
          node -e "
            const fs=require('fs');let t=fs.readFileSync('m.txt','utf8');let m;try{m=JSON.parse(t)}catch(e){console.log('::notice::not json');process.exit(0)}
            const as=[m.launchAsset,...(m.assets||[])].filter(Boolean);
            fs.writeFileSync('urls.txt',as.map(a=>a.url).join('\n'));console.log('::notice::assets '+as.length);" 
          [ -f urls.txt ] && head -2 urls.txt | while read u; do a=$(curl -s -o b1 -w '%{http_code}' -A okhttp/4.12.0 "$u"); b=$(curl -s -o b2 -w '%{http_code}' -H "Authorization: Bearer $EXPO_TOKEN" "$u"); echo "::notice::asset plain=$a auth=$b body=$(head -c 200 b1 | tr '\n' ' ')"; done
          true
